[project]
name = "google-ads-transparency"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reverse-engineer your competitors' Google ad strategy. Built on the public Ads Transparency Center. Python 3.11+, no auth."
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["client", "api"]

[tool.setuptools.package-data]
client = ["geo_targets_countries.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: makes a small request to the live Google Ads Transparency Center"]
